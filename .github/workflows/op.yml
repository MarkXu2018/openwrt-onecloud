name: openwrt

on:
workflow_dispatch:

env:
REPO_URL: https://github.com/openwrt/openwrt
REPO_BRANCH: openwrt-23.05
DIY_P1_SH: sh/op.sh

jobs:
build:
runs-on: ubuntu-22.04

```
steps:
- name: 拉取代码
  uses: actions/checkout@v4

- name: 释放磁盘
  run: |
    sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php
    sudo docker image prune -a -f
    df -h

- name: 安装依赖
  run: |
    sudo apt-get update
    sudo apt-get install -y build-essential clang flex bison g++ gawk \
    gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
    python3 python3-distutils rsync unzip zlib1g-dev file wget

- name: 克隆源码
  run: |
    git clone $REPO_URL openwrt
    cd openwrt
    git checkout $(git tag | grep v23 | sort -V | tail -1)

- name: 更新 feeds（关键）
  run: |
    cd openwrt
    ./scripts/feeds update -a || ./scripts/feeds update -a
    ./scripts/feeds install -a

- name: 拉取 OpenClash
  run: |
    cd openwrt
    git clone https://github.com/vernesong/OpenClash package/OpenClash

- name: 添加玩客云支持
  run: |
    git clone https://github.com/shiyu1314/s805 -b 6.12 openwrt/target/linux/amlogic

- name: 写入配置
  run: |
    cat <<EOF >> openwrt/.config
    CONFIG_TARGET_amlogic=y
    CONFIG_TARGET_amlogic_meson8b=y
    CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y

    CONFIG_TARGET_ROOTFS_PARTSIZE=600

    CONFIG_PACKAGE_luci=y
    CONFIG_PACKAGE_luci-app-openclash=y
    CONFIG_PACKAGE_luci-app-ttyd=y
    CONFIG_PACKAGE_luci-app-diskman=y
    CONFIG_PACKAGE_luci-app-samba4=y
    CONFIG_PACKAGE_luci-app-openlist2=y
    CONFIG_PACKAGE_luci-app-hd-idle=y

    # 关闭无用
    # CONFIG_PACKAGE_luci-app-emby is not set
    # CONFIG_PACKAGE_luci-app-momo is not set
    EOF

- name: 下载依赖
  run: |
    cd openwrt
    make defconfig
    make download -j8

- name: 编译固件
  run: |
    cd openwrt
    make -j$(nproc) || make -j1 V=s

- name: 整理固件
  run: |
    cd openwrt/bin/targets/*/*
    ls

- name: 上传固件
  uses: actions/upload-artifact@v4
  with:
    name: openwrt-onecloud
    path: openwrt/bin/targets/
```
